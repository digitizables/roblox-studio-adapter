[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblox-studio-adapter"
version = "0.1.2"
description = "Compatibility layer that lets an external agent drive the open Roblox Studio session through the built-in MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Paul Beck" }]
keywords = ["roblox", "roblox-studio", "mcp", "luau", "adapter"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/digitizables/roblox-studio-adapter"
Repository = "https://github.com/digitizables/roblox-studio-adapter"
Documentation = "https://github.com/digitizables/roblox-studio-adapter/tree/main/docs"

[project.scripts]
roblox-studio-adapter = "roblox_studio_adapter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
